name: Secret Scan

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/secret-scan.yml'
  pull_request:
    paths:
      - '.github/workflows/secret-scan.yml'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # OSS CLI (no GITLEAKS_LICENSE). Scans full git history of the checked-out repo.
        run: |
          set -euo pipefail
          CONFIG=""
          if [ -f .gitleaks.toml ]; then
            CONFIG="--config=/repo/.gitleaks.toml"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact --exit-code=1 $CONFIG
