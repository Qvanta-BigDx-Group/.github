    <path d="M160 0 V480 M320 0 V480 M480 0 V480 M640 0 V480 M800 0 V480 M960 0 V480 M1120 0 V480"/>
  </g>
  <!-- orbital rings -->
  <g fill="none" stroke="#9DB5FF" stroke-opacity="0.28" transform="translate(1020 150)">
    <ellipse rx="92" ry="36" stroke-width="1.2"/>
    <ellipse rx="92" ry="36" stroke-width="1.2" transform="rotate(60)"/>
    <ellipse rx="92" ry="36" stroke-width="1.2" transform="rotate(120)"/>
