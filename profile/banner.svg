<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Qvanta BigΔx">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="45%" stop-color="#0A1424"/>
      <stop offset="100%" stop-color="#101C33"/>
    </linearGradient>
    <radialGradient id="aurora" cx="78%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#2F5BEA" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#2F5BEA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2F5BEA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#1BABB8" stop-opacity="0.18"/>
