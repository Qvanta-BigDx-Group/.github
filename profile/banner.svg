  <text x="72" y="236" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial" font-size="54" font-weight="600" letter-spacing="-1.4" fill="#F2F4F8">Security for the</text>
  <text x="72" y="298" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial" font-size="54" font-weight="600" letter-spacing="-1.4" fill="#F2F4F8">quantum era.</text>
  <text x="72" y="352" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial" font-size="18" fill="#97A3B6">Encryption · malware protection · secure messaging</text>
