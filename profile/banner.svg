    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F5BEA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9DB5FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2F5BEA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#aurora)"/>
  <rect width="1280" height="480" fill="url(#aurora2)"/>
  <!-- orbital glow -->
  <ellipse cx="980" cy="140" rx="220" ry="120" fill="#2F5BEA" opacity="0.12" filter="url(#soft)">
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <!-- fine grid -->
